<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <input type="text" id="in">
    <input type="text">
    <label for="">Days</label>
    <input type="text">
    <label for="">Hours</label>
    <input type="text">
    <label for="">Mins</label>
    <input type="text">
    <label for="">Secs</label>


    <script>
        function vs(){
            var inp = document.querySelectorAll("input");



            var newdate = "14 feb 2025 12:00 am"
            var now = new Date();
            var nd = new Date(newdate)

            var diff = nd - now;

            
            inp[0].value = Math.floor(diff/(1000*60*60*24))
            inp[1].value = Math.floor(diff/(1000*60*60))
            inp[2].value = Math.floor(diff/(1000*60))
            inp[3].value = Math.floor( diff/(1000))
        }

        setInterval(vs,1000)
    </script>
</body>
</html>
