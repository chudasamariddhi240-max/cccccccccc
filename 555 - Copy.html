<!DOCTYPE html>
<html lang="en">

<head>
	<title>VS</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			font-family: sans-serif;
		}

		.card-con{
			perspective: 1500px;
		}
		body {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
		}

		.card {
			width: 400px;
			height: 300px;
			transition: .5s;
			transform-style: preserve-3d;
			position: relative;
		}

		.cf {
			width: 100%;
			height: 100%;
			backface-visibility: hidden;
			position: absolute;

		}

		.front{
			background-color: lightcoral;
			transform: rotateY(0deg);
		}
		
		.back{
			background-color: lightgreen;
			transform: rotateY(180deg);
			
		}
		
		.card:hover{
			transform: rotateY(180deg);

		}
	</style>
</head>

<body>
	<div class="card-con">
		<div class="card">
			<div class="cf front">
				<h2>FRONT</h2>
			</div>

			<div class="cf back">
				<h2>back</h2>
			</div>

		</div>
	</div>
</body>

</html>
