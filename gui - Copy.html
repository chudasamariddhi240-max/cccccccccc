<!DOCTYPE html>
<html lang="en">
<head>
    <title>vs</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
            padding: 0;
            font-family: sans-serif
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: lightblue;
        }

        button{
            width: 200px;
            height: 100px;
            font-size: 33px;
            border-radius: 20px;
            background: darkcyan;
            cursor: pointer;
            color: white;
            border: none;
        }
        #modal{
            background: lightcoral;
            position: absolute;
            display: none;
            padding: 55px;
            width: 50%;
            height: 300px;
            border-radius: 20px;
            border: none;
        }
        
        h2{
            font-size: 44px;
        }

        h1{
            float: right;
            font-size: 67px;
            cursor: pointer;
        }

        h1:hover{
            scale: 1.2;
        }

    </style>
</head>
<body>
    <button onclick="vs()">click me</button>
    <div id="modal">
        <h1 onclick="closemd()">&times;</h1>
        <H2>this is Modal</H2>
    </div>


    <script>
        function vs(){
            var md = document.getElementById("modal");

            md.style.display = "block";
        }
        function closemd(){
            var md = document.getElementById("modal");
            console.log("veer");
            
            md.style.display = "none";
        }
    </script>
</body>
</html>
