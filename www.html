<!DOCTYPE html>
<html lang="en">
<head>
    <title>VS</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .tc{
            position: absolute;
            top: 0;
            background-color: rgba(189, 183, 107, 0.416);
            left: 80px;
            padding: 5px;
            visibility: hidden;
            border-radius: 20px;
        }

        .tt{
            display: inline-block;
        }

        .tt:hover .tc{
            visibility: visible;
        }
    </style>
</head>
<body>
    <div class="tt"> VEER SIR
        <div class="tc">GREAT SIR</div>
    </div>
</body>
</html>
