<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <input type="text" name="" id="inp">
    <button onclick="vs()">CLick me</button>
    <h1 id="op"></h1>
    <script>
        function vs(){
            var name = document.getElementById("inp").value;
            localStorage.setItem("username", name)
            document.getElementById("op").innerHTML = name;
        }
        
        
        var saved = localStorage.getItem("username");
        document.getElementById("op").innerHTML = saved;
        
    </script>
    
</body>
</html>
