<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .con {
            width: 400px;
            height: 300px;
            border-radius: 20px;
            margin: auto;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 100%;
        }

        button {
            font-size: 45px;
        }
    </style>
</head>

<body>
    <div class="con">
        <img src="https://images.unsplash.com/photo-1728044849248-e90f3ec6a889?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="" id="op">

    </div>
    <button onclick="sv()">Pre</button>
    <button onclick="vs()">Next</button>

    <script>
        var op = document.getElementById("op");
        var index = 0
        const keep = [
            "https://images.unsplash.com/photo-1692382162658-b70805e25201?q=80&w=2020&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1697299708650-e4d1ce150d38?q=80&w=2072&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1653052426343-2ecd2a9a06d5?q=80&w=2072&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        ]

        function vs() {
            index = (index + 1) % keep.length
            op.src = keep[index]

        }
        function sv() {
            index = (index - 1 + keep.length) % keep.length
            op.src = keep[index+ 1] % keep. length
        setInterval(vs, 1000)

    </script>
</body>


</html>
